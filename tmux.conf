# corral's own tmux server config (`tmux -L corral`), independent of ~/.tmux.conf:
# no plugins, no resurrect/continuum, nothing shared with the normal server.
# Prefix Ctrl+Space, vi copy mode and an indigo theme; change them here.
# #{@corral_bin} and #{@corral_conf} are set by corral on every start.

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g focus-events on
set -g default-terminal 'tmux-256color'
set -as terminal-features ',xterm*:RGB'
set -g escape-time 10
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1

# No status bar: the sidebar is the task list, and parked tasks live in
# hidden windows that should not show up anywhere.
set -g status off

# The window title follows the focused pane (Claude Code's "✻ ..." etc.),
# so i3 tabs/stacks show what is running.
set -g set-titles on
set -g set-titles-string '#T'

# Bells and silence are recorded on parked windows, nothing is printed.
set -g monitor-bell on
set -g bell-action none
set -g visual-bell off

# Copy mode: prefix [ , v / Space select, y yank to clipboard
setw -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Panes
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R

# Minimum sidebar width in columns, 23 is about 200 px; drag the border to widen it.
# (Below the minimum only to leave the task 20 columns.)
set -g @corral_sidebar_width 23

# --- corral keys -----------------------------------------------------------
# Parked tasks are hidden windows, so tmux's own window and session keys would
# show one without the sidebar (the corral seems gone). They are taken over:
# prefix n/p next/prev task, prefix c new shell; the rest are removed.
unbind 0; unbind 1; unbind 2; unbind 3; unbind 4
unbind 5; unbind 6; unbind 7; unbind 8; unbind 9
unbind w; unbind f; unbind "'"; unbind (; unbind ); unbind L
unbind .; unbind &; unbind $; unbind M-n; unbind M-p
bind n run-shell -b '#{@corral_bin} step "#{session_name}" 1'
bind p run-shell -b '#{@corral_bin} step "#{session_name}" -1'
bind c run-shell -b '#{@corral_bin} new "#{session_name}" "#{pane_current_path}"'
# Alt+j/k, Alt+Up/Down: previous/next task (from anywhere in a set)
bind -n M-j run-shell -b '#{@corral_bin} step "#{session_name}" 1'
bind -n M-k run-shell -b '#{@corral_bin} step "#{session_name}" -1'
bind -n M-Down run-shell -b '#{@corral_bin} step "#{session_name}" 1'
bind -n M-Up run-shell -b '#{@corral_bin} step "#{session_name}" -1'
# prefix D: dock this pane into a set (menu)    prefix U: undock to its own window
bind D run-shell -b '#{@corral_bin} dock-menu "#{pane_id}" "#{client_name}"'
bind U run-shell -b '#{@corral_bin} undock "#{pane_id}"'
# prefix S: switch set (menu)                   prefix s: focus the sidebar
bind S run-shell -b '#{@corral_bin} set-menu "#{client_name}"'
bind s run-shell -b '#{@corral_bin} focus-sidebar "#{session_name}"'
# prefix b: hide/show the sidebar (zooms the shown task; Alt+j/k keep it hidden)
bind b run-shell -b '#{@corral_bin} toggle-sidebar "#{session_name}"'
bind r source-file -F '#{@corral_conf}' \; display-message 'corral config reloaded'

# A loose terminal whose window was closed takes its session with it.
set-hook -g client-detached 'run-shell -b "#{@corral_bin} reap"'
set-hook -g client-session-changed 'run-shell -b "#{@corral_bin} reap"'

# Theme (indigo)
set -g pane-border-style 'fg=#3730A3'
set -g pane-active-border-style 'fg=#6366F1'
set -g message-style 'bg=#312E81,fg=#F1F5F9,bold'
set -g message-command-style 'bg=#3730A3,fg=#F1F5F9'
set -g mode-style 'bg=colour54,fg=white,bold'
set -g menu-style 'bg=#1E1B4B,fg=#F1F5F9'
set -g menu-selected-style 'bg=#3730A3,fg=#F1F5F9,bold'
set -g menu-border-style 'fg=#6366F1'
set -g popup-border-style 'fg=#6366F1'
set -g copy-mode-match-style 'bg=#FDE047,fg=#000000'
set -g copy-mode-current-match-style 'bg=#FACC15,fg=#000000,bold'
